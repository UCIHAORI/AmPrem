<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AxzyeDev — Alight Motion Premium Generator</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Segoe UI', 'Inter', system-ui, sans-serif;
    }

    body {
      background: #07070d;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      padding: 20px;
      position: relative;
      overflow-x: hidden;
    }

    body::before {
      content: '';
      position: fixed;
      top: -30%;
      left: -20%;
      width: 60%;
      height: 60%;
      background: radial-gradient(circle, rgba(0, 210, 255, 0.08) 0%, transparent 70%);
      pointer-events: none;
    }

    body::after {
      content: '';
      position: fixed;
      bottom: -30%;
      right: -20%;
      width: 60%;
      height: 60%;
      background: radial-gradient(circle, rgba(156, 39, 176, 0.08) 0%, transparent 70%);
      pointer-events: none;
    }

    .card {
      background: rgba(14, 14, 24, 0.92);
      border: 1px solid rgba(0, 210, 255, 0.25);
      border-radius: 24px;
      padding: 36px 28px;
      width: 100%;
      max-width: 440px;
      box-shadow:
        0 0 60px rgba(0, 210, 255, 0.12),
        0 0 120px rgba(156, 39, 176, 0.08);
      backdrop-filter: blur(12px);
      position: relative;
      z-index: 1;
    }

    .logo {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      margin-bottom: 6px;
    }

    .logo-icon {
      width: 36px;
      height: 36px;
      background: linear-gradient(135deg, #00d2ff, #9c27b0);
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      font-weight: 900;
      box-shadow: 0 0 20px rgba(0, 210, 255, 0.4);
    }

    h1 {
      font-size: 20px;
      font-weight: 800;
      letter-spacing: 1px;
      background: linear-gradient(90deg, #00d2ff, #9c27b0, #ff0080);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .subtitle {
      text-align: center;
      color: rgba(255, 255, 255, 0.4);
      font-size: 11px;
      letter-spacing: 3px;
      text-transform: uppercase;
      margin-bottom: 30px;
      margin-top: 4px;
    }

    .info-box {
      background: rgba(0, 210, 255, 0.05);
      border: 1px solid rgba(0, 210, 255, 0.15);
      border-radius: 12px;
      padding: 12px 14px;
      margin-bottom: 20px;
      font-size: 11px;
      color: rgba(255, 255, 255, 0.6);
      line-height: 1.6;
    }

    .info-box strong {
      color: #00d2ff;
    }

    label {
      display: block;
      font-size: 10px;
      color: rgba(255, 255, 255, 0.5);
      letter-spacing: 1.5px;
      text-transform: uppercase;
      margin-bottom: 8px;
      font-weight: 600;
    }

    input {
      width: 100%;
      padding: 15px 18px;
      background: rgba(0, 0, 0, 0.45);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 14px;
      color: #fff;
      font-size: 14px;
      outline: none;
      transition: all 0.25s;
      margin-bottom: 18px;
    }

    input:focus {
      border-color: #00d2ff;
      box-shadow: 0 0 0 3px rgba(0, 210, 255, 0.1);
      background: rgba(0, 0, 0, 0.6);
    }

    input::placeholder {
      color: rgba(255, 255, 255, 0.25);
    }

    button {
      width: 100%;
      padding: 16px;
      background: linear-gradient(90deg, #00d2ff, #9c27b0);
      border: none;
      border-radius: 14px;
      color: #fff;
      font-size: 14px;
      font-weight: 700;
      letter-spacing: 1.5px;
      cursor: pointer;
      transition: all 0.2s;
      position: relative;
      overflow: hidden;
    }

    button:hover:not(:disabled) {
      transform: translateY(-1px);
      box-shadow: 0 8px 25px rgba(0, 210, 255, 0.35);
    }

    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      transform: none;
    }

    .spinner {
      display: inline-block;
      width: 16px;
      height: 16px;
      border: 2px solid rgba(255, 255, 255, 0.3);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      margin-right: 8px;
      vertical-align: middle;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .result {
      margin-top: 20px;
      padding: 16px;
      border-radius: 14px;
      background: rgba(0, 0, 0, 0.4);
      border: 1px solid rgba(255, 255, 255, 0.08);
      font-size: 12px;
      line-height: 1.7;
      display: none;
      word-break: break-word;
      animation: fadeIn 0.3s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(-6px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .result.success {
      border-color: rgba(0, 255, 136, 0.4);
      background: rgba(0, 255, 136, 0.05);
    }

    .result.success .result-title {
      color: #00ff88;
    }

    .result.error {
      border-color: rgba(255, 51, 85, 0.4);
      background: rgba(255, 51, 85, 0.05);
    }

    .result.error .result-title {
      color: #ff3355;
    }

    .result.loading .result-title {
      color: #00d2ff;
    }

    .result-title {
      font-weight: 700;
      font-size: 13px;
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .result pre {
      background: rgba(0, 0, 0, 0.5);
      padding: 10px;
      border-radius: 8px;
      font-size: 11px;
      overflow-x: auto;
      margin-top: 8px;
      color: rgba(255, 255, 255, 0.7);
      white-space: pre-wrap;
      word-break: break-all;
    }

    .footer {
      text-align: center;
      margin-top: 24px;
      font-size: 10px;
      color: rgba(255, 255, 255, 0.2);
      letter-spacing: 1px;
    }

    .footer a {
      color: rgba(0, 210, 255, 0.6);
      text-decoration: none;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">
      <div class="logo-icon">⚡</div>
      <h1>AXZYEDEV</h1>
    </div>
    <p class="subtitle">Alight Motion Premium Generator</p>

    <div class="info-box">
      <strong>📌 Informasi:</strong> Masukkan email aktif. Sistem akan membuat akun
      Alight Motion Premium selama 1 tahun (12 bulan).
    </div>

    <label for="email">Alamat Email</label>
    <input
      type="email"
      id="email"
      placeholder="youremail@gmail.com"
      autocomplete="email"
    />

    <button id="btnGenerate" onclick="generatePremium()">
      🚀 GENERATE PREMIUM
    </button>

    <div id="result" class="result"></div>

    <div class="footer">
      Powered by <a href="https://axzyedev.biz.id" target="_blank">AxzyeDev</a>
      • Unofficial Third-Party Engine
    </div>
  </div>

  <script>
    // ═══════════════════════════════════════════════════════════
    // ★★★ KONFIGURASI API ★★★
    // ═══════════════════════════════════════════════════════════
    const API_KEY = 'proxy.php';
    const BASE_URL = 'proxy.php';
    // ═══════════════════════════════════════════════════════════
    //
    // ⚠️ CATATAN PENTING:
    // Karena dokumentasi API AxzyeDev tidak dapat diakses publik,
    // endpoint di bawah ini adalah ASUMSI berdasarkan pola API
    // layanan serupa. Anda perlu menyesuaikannya dengan endpoint
    // yang benar dari dashboard AxzyeDev Anda.
    //
    // Endpoint yang mungkin:
    //   - /api/v1/alight/generate
    //   - /api/v1/generate
    //   - /api/v1/am/create
    //   - /api/v1/premium/alight
    //
    // ═══════════════════════════════════════════════════════════

    function showResult(html, type) {
      const el = document.getElementById('result');
      el.innerHTML = html;
      el.className = 'result ' + type;
      el.style.display = 'block';
    }

    function formatJSON(obj) {
      try {
        return JSON.stringify(obj, null, 2);
      } catch (e) {
        return String(obj);
      }
    }

    async function generatePremium() {
      const email = document.getElementById('email').value.trim();
      const btn = document.getElementById('btnGenerate');

      if (!email) {
        showResult(
          '<div class="result-title">❌ Email kosong</div>Masukkan alamat email yang valid.',
          'error'
        );
        return;
      }

      const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
      if (!emailRegex.test(email)) {
        showResult(
          '<div class="result-title">❌ Format email salah</div>Contoh: nama@gmail.com',
          'error'
        );
        return;
      }

      btn.disabled = true;
      btn.innerHTML = '<span class="spinner"></span> MEMPROSES...';
      showResult(
        '<div class="result-title">⏳ Memproses...</div>Engine sedang membuat akun premium.',
        'loading'
      );

      // ══════════════════════════════════════════════════════
      // ENDPOINT — SESUAIKAN DENGAN DOKUMENTASI AXZYEDEV
      // ══════════════════════════════════════════════════════
      const ENDPOINT = `${BASE_URL}/alight/generate`;
      // Ganti 'alight/generate' dengan endpoint yang benar
      // ══════════════════════════════════════════════════════

      try {
        const response = await fetch(ENDPOINT, {
          method: 'POST',
          headers: {
            'Authorization': `Bearer ${API_KEY}`,
            'Content-Type': 'application/json',
          },
          body: JSON.stringify({
            email: email,
            duration: 12, // 12 bulan
          }),
        });

        const data = await response.json();
        console.log('[GENERATE] Response:', data);

        if (
          response.ok &&
          (data.success === true ||
            data.status === 'success' ||
            data.status === 'ok')
        ) {
          // Format hasil
          let output = '<div class="result-title">🎉 BERHASIL!</div>';
          output += `<b>Email:</b> ${email}<br>`;

          if (data.data) {
            if (data.data.email) output += `<b>Email:</b> ${data.data.email}<br>`;
            if (data.data.password)
              output += `<b>Password:</b> ${data.data.password}<br>`;
            if (data.data.link)
              output += `<b>Link Aktivasi:</b> <a href="${data.data.link}" target="_blank">${data.data.link}</a><br>`;
            if (data.data.duration)
              output += `<b>Durasi:</b> ${data.data.duration} bulan<br>`;
          }

          output += '<br>✨ Nikmati fitur premium Alight Motion!';
          output += `<pre>${formatJSON(data)}</pre>`;

          showResult(output, 'success');
        } else {
          const errMsg =
            data.message || data.error || data.msg || 'Gagal generate';
          showResult(
            `<div class="result-title">❌ Gagal Generate</div>
             <b>Status:</b> ${response.status}<br>
             <b>Error:</b> ${errMsg}
             <pre>${formatJSON(data)}</pre>`,
            'error'
          );
        }
      } catch (err) {
        console.error('[GENERATE] Error:', err);
        showResult(
          `<div class="result-title">❌ Error Koneksi</div>
           <b>Pesan:</b> ${err.message}<br>
           <br>Pastikan koneksi internet lancar & API key valid.`,
          'error'
        );
      } finally {
        btn.disabled = false;
        btn.innerHTML = '🚀 GENERATE PREMIUM';
      }
    }

    // Enter key shortcut
    document.getElementById('email').addEventListener('keydown', function (e) {
      if (e.key === 'Enter') generatePremium();
    });
  </script>
</body>
</html>
